{% if page.url contains "/cn/" %}
  {% assign nav = site.data.navigation["cn-main"] %}
{% else %}
  {% assign nav = site.data.navigation["main"] %}
{% endif %}

<header class="site-header">
  <div class="nav-container"> <!-- 🔥 统一的导航栏容器 -->
    <nav class="site-nav">
      <ul class="menu">
        {% for item in nav %}
          <li>
            <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
